<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geologica'; src: url('../src/renderer/src/assets/fonts/Geologica.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .icon {
    position: absolute; inset: 40px; border-radius: 230px; overflow: hidden;
    background: radial-gradient(70% 60% at 50% 30%, #3a8e6b, #1f5b45 48%, #0f3226 100%);
    box-shadow: inset 0 0 0 26px #2b1d16, inset 0 0 0 30px rgba(0,0,0,.35), inset 0 18px 40px rgba(0,0,0,.4);
  }
  .icon::before {
    content: ''; position: absolute; inset: 58px; border-radius: 180px;
    border: 7px dashed rgba(240, 179, 87, 0.28);
  }
  .glow { position: absolute; left: 50%; top: 34%; width: 820px; height: 620px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(255, 214, 150, .35), transparent); mix-blend-mode: soft-light; }
  .letter {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: 'Geologica'; font-weight: 800; font-size: 640px; line-height: 1;
    font-variation-settings: 'SHRP' 100; color: #f0b357; padding-bottom: 30px; padding-left: 20px;
    text-shadow: 0 18px 30px rgba(0, 0, 0, .45), 0 2px 0 rgba(255, 230, 190, .35);
  }
</style>
</head>
<body><div class="icon"><div class="glow"></div><div class="letter">Р</div></div></body>
</html>
