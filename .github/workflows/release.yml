name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, который пересобрать (например v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Релиз создаём заранее: иначе electron-builder грузит файлы параллельно
      # и может завести на одном теге два релиза. Повторный запуск берёт уже созданный черновик.
      - name: Черновик релиза
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Ривер $TAG" --notes-file .github/release-notes.md
      - name: Собрать установщик и portable, выложить в черновик
        run: npx electron-builder --win --x64 --publish always
        env:
          # Черновик независимо от конфига на теге.
          EP_DRAFT: 'true'
      - name: Опубликовать релиз
        run: gh release edit "$TAG" --draft=false --latest
