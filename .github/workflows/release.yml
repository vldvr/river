name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, который пересобрать (например v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Проверить соответствие версии тегу
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          test "$PKG_VERSION" = "$TAG_VERSION" || {
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG)"
            exit 1
          }
      # Релиз создаём заранее, а публикацию делаем отдельным gh upload:
      # так повторный запуск работает и для уже опубликованного релиза.
      - name: Черновик релиза
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Ривер $TAG" --notes-file .github/release-notes.md
      - name: Собрать установщик и portable
        run: |
          rm -rf release
          npx electron-builder --win --x64 --publish never
      - name: Загрузить артефакты в релиз
        run: gh release upload "$TAG" release/*.exe release/*.blockmap release/latest.yml --clobber
      - name: Опубликовать релиз
        run: gh release edit "$TAG" --draft=false --latest
