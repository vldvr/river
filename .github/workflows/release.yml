name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Релиз создаём заранее: иначе electron-builder грузит файлы параллельно
      # и может завести на одном теге два релиза.
      - name: Черновик релиза
        run: gh release create ${{ github.ref_name }} --draft --title "Ривер ${{ github.ref_name }}" --notes-file .github/release-notes.md
      - name: Собрать установщик и portable, выложить в черновик
        run: npx electron-builder --win --x64 --publish always -c.publish.releaseType=draft
      - name: Опубликовать релиз
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
