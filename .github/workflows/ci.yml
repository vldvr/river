name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    # Собранное приложение на настоящем Windows: запуск, игра с ботами, скриншоты.
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --dir --publish never
      - run: node e2e/smoke.mjs --exe release/win-unpacked/River.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: test-results/smoke
