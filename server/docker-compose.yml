services:
  relay:
    build: .
    container_name: river-relay
    restart: unless-stopped
    ports:
      - '127.0.0.1:8095:8080'
    environment:
      # Порт открыт только на localhost, снаружи ходят через nginx: ему можно верить в X-Real-IP.
      TRUST_PROXY: '1'
    volumes:
      # Рейтинги игроков. Бэкап: /root/river-relay/data/river.db
      - ./data:/app/data
    mem_limit: 128m
    logging:
      options:
        max-size: '5m'
        max-file: '2'
