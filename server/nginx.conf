# /etc/nginx/sites-available/river.wkiseven.me
# Ривер: сервер комнат. Контейнер river-relay на 127.0.0.1:8095, исходники /root/river-relay,
# выкат: server/deploy.sh в репозитории vldvr/river.

map $http_upgrade $river_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name river.wkiseven.me;
    listen 127.0.0.1:4443 ssl proxy_protocol;
    ssl_certificate /etc/letsencrypt/live/river.wkiseven.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/river.wkiseven.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /ws {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $river_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Партия может идти часами: соединение держим, сервер сам шлёт ping раз в 25 с.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name river.wkiseven.me;
    return 301 https://$host$request_uri;
}
